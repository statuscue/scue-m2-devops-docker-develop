server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/example.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.privkey.pem;
    server_name m2-develop-local.example.ua;

    set $MAGE_ROOT /var/www/html/pub;
    set $MAGE_IS_DEVELOPER_MODE true;

    root $MAGE_ROOT;

    index index.php;
    autoindex off;
    charset off;

    add_header 'X-Content-Type-Options' 'nosniff';

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ cron\.php {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass awdev_m2_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
    }

    # Log files
    error_log /var/log/nginx/magento_error.log warn;
    access_log /var/log/nginx/magento_access.log combined;
}
