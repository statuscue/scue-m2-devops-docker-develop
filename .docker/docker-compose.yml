
services:
  nginx:
    build:
      context: ./docker/nginx
      args:
        MAGENTO_USER_WEB: ${MAGENTO_USER_WEB}
        MAGENTO_UID_WEB: ${MAGENTO_UID_WEB}
    container_name: scue_m2_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./magento:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl/example.fullchain.pem:/etc/nginx/ssl/example.fullchain.pem
      - ./docker/nginx/ssl/example.privkey.pem:/etc/nginx/ssl/example.privkey.pem
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        AMASTY_USERNAME: ${AMASTY_USERNAME}
        AMASTY_PASSWORD: ${AMASTY_PASSWORD}
        MAGENTO_USERNAME: ${MAGENTO_USERNAME}
        MAGENTO_PASSWORD: ${MAGENTO_PASSWORD}
        MAGENTO_USER_WEB: ${MAGENTO_USER_WEB}
        MAGENTO_UID_WEB: ${MAGENTO_UID_WEB}
    container_name: awdev_m2_php
    ports:
      - "9000:9000"
    volumes:
      - ./magento:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - COMPOSER_MEMORY_LIMIT=-1
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - AMASTY_USERNAME=${AMASTY_USERNAME}
      - AMASTY_PASSWORD=${AMASTY_PASSWORD}
      - MAGENTO_USERNAME=${MAGENTO_USERNAME}
      - MAGENTO_PASSWORD=${MAGENTO_PASSWORD}
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mariadb:10.6.18
    container_name: example_m2_db
    ports:
      - "3306:3306"
    volumes:
      - ./data/db:/var/lib/mysql
      - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  redis:
    build:
      context: ./docker/redis
      args:
        MAGENTO_USER_WEB: ${MAGENTO_USER_WEB}
        MAGENTO_UID_WEB: ${MAGENTO_UID_WEB}
    container_name: example_m2_redis
    volumes:
      - ./data/redis:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: example_m2_rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  elasticsearch:
    image: elasticsearch:7.17.25
    container_name: example_m2_elasticsearch
    environment:
      - discovery.type=single-node
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  db-data:
  elasticsearch_data:

